network:
  version: 2
  renderer: NetworkManager
  ethernets:
    ens33:
      match:
        macaddress: 00:0c:29:b3:18:a3
      set-name: ens33
      dhcp4: true
      dhcp4-overrides:
        route-metric: 200
        use-dns: false
        use-routes: false
      dhcp6: false
      accept-ra: false
      networkmanager:
        passthrough:
          ipv4.ignore-auto-dns: "true"
    ens37:
      match:
        name: ens37
      addresses:
        - 10.10.10.10/24
      nameservers:
        addresses:
          - 10.10.10.1
      routes:
        - to: default
          via: 10.10.10.1
          metric: 50
        - to: 10.10.0.0/16
          via: 10.10.10.1
          metric: 100
      dhcp6: false
      accept-ra: false
      networkmanager:
        passthrough:
          ipv4.route-metric: "50"
