[SERVICE]
    Flush                 1
    Log_Level             info
    Parsers_File          /etc/fluent-bit/parsers.conf
    storage.path          /var/lib/fluent-bit/storage
    storage.sync          normal

[INPUT]
    Name                  tail
    Path                  /var/log/audit/audit.log
    Tag                   lab.target.audit
    DB                    /var/lib/fluent-bit/target-audit.db
    Read_from_Head        false
    storage.type          filesystem

[INPUT]
    Name                  tail
    Path                  /var/log/auth.log
    Tag                   lab.target.auth
    DB                    /var/lib/fluent-bit/target-auth.db
    Read_from_Head        false
    storage.type          filesystem

[INPUT]
    Name                  tail
    Path                  /var/log/lab-target/canary-received.jsonl
    Tag                   lab.target.canary
    Parser                json
    DB                    /var/lib/fluent-bit/target-canary.db
    Read_from_Head        true
    storage.type          filesystem

[OUTPUT]
    Name                  forward
    Match                 lab.target.*
    Host                  10.10.40.10
    Port                  24224
    Retry_Limit           False
