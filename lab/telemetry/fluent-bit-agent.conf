[SERVICE]
    Flush                 1
    Log_Level             info
    Parsers_File          /etc/fluent-bit/parsers.conf
    storage.path          /var/lib/fluent-bit/storage
    storage.sync          normal

[INPUT]
    Name                  tail
    Path                  /var/log/audit/audit.log
    Tag                   lab.agent.audit
    DB                    /var/lib/fluent-bit/agent-audit.db
    Read_from_Head        false
    storage.type          filesystem

[INPUT]
    Name                  tail
    Path                  /var/log/auth.log
    Tag                   lab.agent.auth
    DB                    /var/lib/fluent-bit/agent-auth.db
    Read_from_Head        false
    storage.type          filesystem

[INPUT]
    Name                  tail
    Path                  /home/*/.local/state/lab-agent/local-mcp.jsonl
    Tag                   lab.agent.local_mcp
    Parser                json
    DB                    /var/lib/fluent-bit/agent-local-mcp.db
    Read_from_Head        true
    storage.type          filesystem

[OUTPUT]
    Name                  forward
    Match                 lab.agent.*
    Host                  10.10.40.10
    Port                  24224
    Retry_Limit           False
