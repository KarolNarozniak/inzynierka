[SERVICE]
    Flush                 1
    Log_Level             info
    Parsers_File          /etc/fluent-bit/parsers.conf
    storage.path          /var/lib/fluent-bit/storage
    storage.sync          normal

[INPUT]
    Name                  tail
    Path                  /var/log/audit/audit.log
    Tag                   lab.gateway.audit
    DB                    /var/lib/fluent-bit/gateway-audit.db
    Read_from_Head        false
    storage.type          filesystem

[INPUT]
    Name                  tail
    Path                  /var/log/auth.log
    Tag                   lab.gateway.auth
    DB                    /var/lib/fluent-bit/gateway-auth.db
    Read_from_Head        false
    storage.type          filesystem

[INPUT]
    Name                  tail
    Path                  /var/log/lab-control/decisions.jsonl
    Tag                   lab.gateway.control
    Parser                json
    DB                    /var/lib/fluent-bit/gateway-control.db
    Read_from_Head        true
    storage.type          filesystem

[OUTPUT]
    Name                  forward
    Match                 lab.gateway.*
    Host                  10.10.40.10
    Port                  24224
    Retry_Limit           False
