[SERVICE]
    Flush                 1
    Log_Level             info
    Parsers_File          /etc/fluent-bit/parsers.conf
    storage.path          /var/lib/fluent-bit/storage
    storage.sync          normal

[INPUT]
    Name                  forward
    Listen                10.10.40.10
    Port                  24224
    Tag_Prefix            received.
    Buffer_Chunk_Size     1M
    Buffer_Max_Size       6M

[INPUT]
    Name                  tail
    Path                  /var/log/audit/audit.log
    Tag                   lab.monitor.audit
    DB                    /var/lib/fluent-bit/monitor-audit.db
    Read_from_Head        false
    storage.type          filesystem

[INPUT]
    Name                  tail
    Path                  /var/log/auth.log
    Tag                   lab.monitor.auth
    DB                    /var/lib/fluent-bit/monitor-auth.db
    Read_from_Head        false
    storage.type          filesystem

[OUTPUT]
    Name                  file
    Match                 received.*
    Path                  /var/log/lab-telemetry
    File                  forwarded.jsonl
    Format                out_file
    Mkdir                 true
    Rotate                true
    Rotate_Max_Size       100M
    Rotate_Max_Files      7

[OUTPUT]
    Name                  file
    Match                 lab.monitor.*
    Path                  /var/log/lab-telemetry
    File                  monitor-local.jsonl
    Format                out_file
    Mkdir                 true
    Rotate                true
    Rotate_Max_Size       100M
    Rotate_Max_Files      7
